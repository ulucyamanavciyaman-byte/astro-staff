name: Build Astro Staff mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Generate Turkish food pack
        run: python3 tools/turk_food.py && python3 tools/turk_restaurant.py
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          grep -A2 'error:' build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          { echo '```'; grep -B1 -A3 'error:' build.log | head -80; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: astro-staff-mod
          path: build/libs/*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Astro Staff mod build ${{ github.run_number }}
          files: |
            build/libs/*.jar
            build/astro_food_pack.zip
